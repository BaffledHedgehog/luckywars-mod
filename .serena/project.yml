# Java navigation; machine paths are in ignored project.local.yml.
project_name: luckywars-mod
language_servers:
- java
encoding: utf-8
ignore_all_files_in_gitignore: true
read_only: true
ignored_paths:
- .git/**
- .gradle/**
- build/**
- out/**
- bin/**
- logs/**
- run/**
- world/**
- worlds/**
- node_modules/**
- '**/*.jar'
- '**/*.class'
- '**/*.nbt'
- '**/*.png'
- '**/*.ogg'
ls_specific_settings:
  java:
    gradle_wrapper_enabled: true
    maven_import_enabled: false
    gradle_import_enabled: true
    autobuild_enabled: false
    update_build_configuration: disabled
    jdtls_xmx: 1536m
    jdtls_xms: 128m
initial_prompt: Use Java symbol definitions and references for repository navigation.
  Read only the relevant symbols, not whole large classes. Code changes use the normal
  repository editing tools. Use ripgrep for legacy datapack functions, JSON, and exact
  text searches.
default_modes: null
added_modes: null
included_apis: []
excluded_apis: []
excluded_tools: []
included_optional_tools: []
fixed_tools:
- initial_instructions
- get_current_config
- activate_project
- get_symbols_overview
- find_symbol
- find_referencing_symbols
- find_implementations
- find_declaration
- get_diagnostics_for_file
- search_for_pattern
- list_memories
- read_memory
symbol_info_budget: null
language_backend: null
agent_interface: null
line_ending: null
read_only_memory_patterns: []
ignored_memory_patterns: []
ls_workspace_folders:
- .
ls_additional_workspace_folders: []
activation_command: null
activation_command_timeout: 180.0
