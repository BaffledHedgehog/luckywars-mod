plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Installed separately on the server as polymer-bundled; do not bundle duplicates.
    implementation "eu.pb4:polymer-core:${project.polymer_version}"
    implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
    implementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
    implementation include("eu.pb4:sgui:2.2.1+26.3")
}

processResources {
    // Legacy assets stay in the working tree; their registries/advancements must not run
    // alongside the new controller or override Minecraft 26.3's built-in dimensions.
    include 'fabric.mod.json', 'skywars2.mixins.json', 'data/skywars2/**', 'data/swrg/structure/**',
            'data/swrg/loot_table/chests/**', 'data/swrg/loot_table/game/**',
            'data/swrg/loot_table/gui/**', 'data/swrg/item_modifier/select.json',
            'data/lbc/loot_table/gui/page/8000/**', 'data/lbc/loot_table/gui/page/8100/**',
            'data/lbc/loot_table/gui/page/9000/**', 'data/lbc/loot_table/gui/page/9100/**',
            'data/lbc/loot_table/gui/page/10000/**', 'data/lbc/loot_table/gui/page/10100/**',
            'data/lbc/loot_table/gui/page/11000/**', 'data/lbc/loot_table/gui/page/11100/**',
            'data/lbc/loot_table/gui/page/12000/**', 'skywars2/**', 'assets/**'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('deployServerMod', Copy) {
    group = 'deployment'
    description = 'Build and copy the server mod to ../mods/skywars2.jar. Stop the server first.'
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('../mods'))
    rename { 'skywars2.jar' }
}
