plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Installed separately on the server as polymer-bundled; do not bundle duplicates.
    implementation "eu.pb4:polymer-core:${project.polymer_version}"
    implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
    implementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
    implementation include("eu.pb4:sgui:2.2.1+26.3")
}

processResources {
    // Exact permanent SWRG case/cosmetic entitlements; no tournament2 or function interpreter.
    (1..26).each { include "data/swrg/advancement/rewards/suffix_${it}.json" }
    (1..3).each { include "data/swrg/advancement/rewards/drop_${it}.json"; include "data/swrg/advancement/rewards/turnir/trophy${it}.json" }
    include 'data/swrg/advancement/rewards/turnir/killer.json'
    include 'data/lbc/loot_table/ported/bad_apple_imba.json'
    // Closed overnight batch: source Touhou pool (all eleven entries), bomb and ready singleton leaves.
    include 'data/lbc/loot_table/touhou_item.json', 'data/lbc/loot_table/bomb_item.json'
