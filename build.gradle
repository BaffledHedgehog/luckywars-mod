java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('deployServerMod', Copy) {
    group = 'deployment'
    description = 'Build and copy the server mod to ../mods/skywars2.jar. Stop the server first.'
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('../mods'))
    rename { 'skywars2.jar' }
}
