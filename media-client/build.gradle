plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
version = '0.1.0'
group = 'me.skywars2'
base { archivesName = 'skywars2-media-client' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
}
sourceSets.main.java.srcDir('../media-protocol/src/main/java')
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
tasks.register('checkMediaTimeline', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.skywars2.media.client.MediaTimelineChecks'
    jvmArgs '-Xmx128m', '-XX:ActiveProcessorCount=2'
}
// This module uses a deterministic executable contract test, with no JUnit dependency.
tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn 'checkMediaTimeline' }
tasks.register('checkNativeMedia', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.skywars2.media.client.NativeMediaChecks'
    jvmArgs '-Xmx256m', '-XX:ActiveProcessorCount=2'
}
tasks.named('check') { dependsOn 'checkNativeMedia' }
tasks.register('checkNativeAudio', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.skywars2.media.client.NativeAudioChecks'
    environment 'ALSOFT_DRIVERS', 'null'
    jvmArgs '-Xmx128m', '-XX:ActiveProcessorCount=2'
}
tasks.named('check') { dependsOn 'checkNativeAudio' }
